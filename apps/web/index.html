<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkLite</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/worklite-logo-180.png" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('worklite.appearance');
          var appearance = stored === 'light' || stored === 'dark' ? stored : 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = appearance === 'dark' || (appearance === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var storedLocale = localStorage.getItem('worklite.locale');
          var locale = 'en';
          if (storedLocale) {
            var normalized = storedLocale.replace(/_/g, '-').toLowerCase();
            if (normalized === 'zh' || normalized.indexOf('zh-cn') === 0 || normalized.indexOf('zh-hans') === 0 || normalized === 'zh-sg') {
              locale = 'zh-CN';
            } else if (normalized === 'en' || normalized.indexOf('en-') === 0) {
              locale = 'en';
            } else {
              locale = 'en';
            }
          } else {
            var languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
            for (var i = 0; i < languages.length; i++) {
              var candidate = String(languages[i] || '').replace(/_/g, '-').toLowerCase();
              if (candidate === 'zh' || candidate.indexOf('zh-cn') === 0 || candidate.indexOf('zh-hans') === 0 || candidate === 'zh-sg') {
                locale = 'zh-CN';
                break;
              }
              if (candidate === 'en' || candidate.indexOf('en-') === 0) {
                locale = 'en';
                break;
              }
            }
          }
          document.documentElement.lang = locale;
        } catch (error) {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
          document.documentElement.lang = 'en';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
