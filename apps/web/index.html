<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkLite</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/worklite-logo-180.png" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('worklite.appearance');
          var appearance = stored === 'light' || stored === 'dark' ? stored : 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = appearance === 'dark' || (appearance === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          document.documentElement.lang = 'zh-CN';
        } catch (error) {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
          document.documentElement.lang = 'zh-CN';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
